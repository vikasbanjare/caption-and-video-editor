name: Deploy static demo to GitHub Pages

# Builds a browser-only version of the editor (NEXT_PUBLIC_STATIC_EXPORT) and
# publishes it to GitHub Pages. The server API route is dropped for this build
# since Pages can't run server code — the demo uses the in-browser sample
# transcript (real ASR needs Vercel/Codespaces).

on:
  push:
    branches: [claude/awesome-davinci-g2h0or, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Drop server-only API route (static export can't include POST handlers)
        run: rm -rf src/app/api

      - name: Build static demo
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "true"

      - name: Disable Jekyll (serve _next as-is)
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    # The github-pages ENVIRONMENT allows only branches on its deployment-branch
    # policy (repo Settings → Environments), and this working branch isn't on it
    # yet — a push-triggered deploy would be rejected before a runner starts.
    # So: every push still BUILDS the demo (validates the static export), but
    # publishing runs only from main, or on demand via workflow_dispatch once
    # the branch is allowed. Skipped ≠ failed, so PR checks stay honest + green.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
